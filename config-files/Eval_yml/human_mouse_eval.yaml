         - dataset_id: "scRNA-Seq/human/hHep"
           should_run: [True]
           exprData: "ExpressionData.csv"
           groundTruthNetwork: "STRING_human_hHep-network_filtered.csv"
           runs:
             - run_id: "hHep_filtered_tfs"

         - dataset_id: "scRNA-Seq/mouse/mDC"
