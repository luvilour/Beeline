# Input Settings: initialize base input folder names,
# dataset collections, and algorithms to run over
input_settings:

    # Base input directory
    input_dir : "inputs"

    # Each dataset entry represents a condition group. Its subdirectories
    # are individual runs (variants) listed under 'runs'.
    datasets:

        - dataset_id: "DREAM5"
          should_run: [True]
          exprData: "ExpressionData.csv"
          groundTruthNetwork: "DREAM5_network1/DREAM5_NetworkInference_Edges_Network1.csv"
          runs:
            - run_id: "DREAM5_network1"

    algorithms:

        # - algorithm_id: "GRNVBEM"
        #   image: "grnbeeline/grnvbem:base"
        #   should_run: [True]
        #   params: {}

        - algorithm_id: DEEPSEM
          image: "deepsem:base"
          should_run: [True]
          params: {}

        - algorithm_id: SCGENERAI
          image: "scgenerai:base"
          should_run: [True]
          params: {}

        # # - algorithm_id: SCGENERAIMIXED
        # #   image: "scgeneraimixed:base"
        # #   should_run: [True]
        # #   params: {}

        - algorithm_id: "GENIE3"
          image: "grnbeeline/arboreto:base"
          should_run: [True]
          params: {}

        - algorithm_id: "GRNBOOST2"
          image: "grnbeeline/arboreto:base"
          should_run: [True]
          params: {}

        - algorithm_id: "LASSONET"
          image: "lassonet:base"
          should_run: [True]
          params: {}

        - algorithm_id: LASSONETPROB
          image: "lassonetprob:base"
          should_run: [True]
          params: {}

        - algorithm_id: LASSONETPROBNORM
