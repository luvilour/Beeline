# Input Settings: initialize base input folder names,
# dataset collections, and algorithms to run over
input_settings:

    # Base input directory
    input_dir : "inputs/BEELINE_CODE/"

    # Each dataset entry represents a condition group. Its subdirectories
    # are individual runs (variants) listed under 'runs'.
    datasets:

        - dataset_id: "scRNA-Seq"
          should_run: [True]
          exprData: "ExpressionData.csv"
          groundTruthNetwork: "mHSC-L/500-network.csv"
          runs:
            - run_id: "mHSC-L"


    algorithms:

